<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>允许读 Ahrefs 数据 · 哥飞 SEO Agent</title>
  <link rel="stylesheet" href="../sidepanel/sidepanel.css">
  <style>
    body { max-width: 560px; margin: 40px auto; }
    h1 { font-size: 18px; margin-bottom: 10px; }
    ul { padding-left: 18px; margin: 8px 0 14px; color: var(--muted); font-size: 13px; }
    #allow { font-size: 15px; padding: 10px; margin-bottom: 8px; }
    #deny { text-align: center; }
  </style>
</head>
<body>
  <section>
    <h1>让 Agent 读你的 Ahrefs</h1>
    <p>对话里的 Agent 要看 <b id="target"></b> 的外链和流量增长。插件会用你登录的 Ahrefs（<b id="host"></b>）打开这个站的 Site Explorer，把页面上的曲线和指标读回来交给 Agent。</p>
    <ul>
      <li>读到的只交给你自己的对话，不进网站的共享缓存。</li>
      <li>只在插件自己打开的标签页里读，读完就关；你自己打开的 Ahrefs 标签页一概不碰。</li>
      <li>Chrome 会问一次；以后随时可以在 chrome://extensions 里收回。</li>
    </ul>
    <button type="button" class="primary" id="allow">允许读 Ahrefs 数据</button>
    <button type="button" id="deny">不允许（这次不读 Ahrefs）</button>
    <p id="status" class="status" hidden></p>
  </section>
  <script src="allow.js"></script>
</body>
</html>
