<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>哥飞 SEO Agent</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <img src="../icons/icon-32.png" alt="" width="24" height="24">
    <h1>哥飞 SEO Agent</h1>
  </header>

  <section id="activityBox">
    <h2>插件正在做的事 <span id="actCount" class="count"></span></h2>
    <p class="hint" id="actEmpty">现在没有任务。Agent 需要谷歌趋势时，这里会实时显示插件在取哪个词、到了哪一步。</p>
    <ol id="actList" class="activity"></ol>
  </section>

  <section>
    <h2>问问这个网站</h2>
    <p class="hint" id="pageHint">切到想看的网页，再点一下浏览器工具栏上的插件图标，这里就会换成那个网站。</p>
    <input id="pageUrl" type="text" placeholder="网址或域名，例如 example.com" spellcheck="false" autocomplete="off">
    <p class="follow"><button type="button" class="link" id="followOn" hidden>自动跟随当前网页</button><span id="followNote"></span></p>
    <div class="btns">
      <button type="button" data-ask="traffic">这个站流量怎么起来的？</button>
      <button type="button" data-ask="keywords">它靠哪些词吃流量？</button>
      <button type="button" data-ask="page">这个页面的 SEO 怎么改？</button>
      <button type="button" id="openAhrefs">在 Ahrefs 看外链和流量趋势 ↗</button>
    </div>
    <textarea id="custom" rows="3" placeholder="也可以自己问，会带上上面这个网址"></textarea>
    <button type="button" class="primary" id="askCustom">问 Agent</button>
  </section>

  <section>
    <h2>谷歌趋势</h2>
    <p class="hint">插件直接去谷歌趋势取数，结果只显示在这里：不经过 Agent、不扣积分、不进网站缓存，方便单独核对。地区不填就是全球。</p>
    <input id="word" type="text" placeholder="关键词，例如 jev" spellcheck="false" autocomplete="off">
    <div class="row">
      <select id="range" aria-label="时间范围">
        <option value="today 12-m" selected>过去 12 个月（按周）</option>
        <option value="today 3-m">过去 90 天（按天）</option>
        <option value="today 1-m">过去 30 天（按天）</option>
        <option value="now 7-d">过去 7 天（按小时）</option>
        <option value="today 5-y">过去 5 年（按周）</option>
      </select>
      <input id="geo" type="text" placeholder="地区如 US" title="两位国家码，如 US / GB / IN；不填 = 全球" maxlength="2" spellcheck="false" autocomplete="off" aria-label="地区（两位国家码）">
    </div>
    <label class="check"><input type="checkbox" id="autoFiner" checked> 发现新的一波，自动再查一次按天 / 按小时的</label>
    <label class="check"><input type="checkbox" id="keepTab"> 取完不关谷歌趋势标签页（对照网页核对）</label>
    <label class="check"><input type="checkbox" id="foreground"> 在前台打开谷歌趋势（排查慢的时候对照用）</label>
    <button type="button" class="primary" id="trendsGo">查询</button>
    <p id="trendsStatus" class="status" hidden></p>
    <div id="results"></div>
    <p class="hint" id="trendsNote" hidden>0~100 是相对热度（这段时间里最热的点 = 100），不是搜索量。虚线是还没过完的那个点。</p>
    <button type="button" id="askWord">问 Agent：这个词是不是新词、值不值得做？</button>
  </section>

  <details class="settings" id="settings">
    <summary>设置</summary>
    <label for="ahrefsBase">Ahrefs 地址（用镜像站就填它的域名，比如 https://ahrefs.3ue.com）</label>
    <input id="ahrefsBase" type="text" placeholder="https://app.ahrefs.com" spellcheck="false" autocomplete="off">
    <button type="button" class="small" id="saveAhrefs">保存</button> <span id="ahrefsSaved" class="hint"></span>
  </details>

  <footer>
    <span id="ver"></span>
    <a href="https://seo.web.cafe/extension/" target="_blank" rel="noopener">使用说明</a>
    <p id="update" hidden></p>
  </footer>
  <script src="../lib/trends-parse.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
